<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Чушпан в баре ЛОЛ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a0a2e;
    font-family: 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    color: #fff;
  }
  #game { position: relative; }
  canvas {
    border: 3px solid #ff006e;
    box-shadow: 0 0 30px #ff006e;
    background: linear-gradient(180deg, #2d0a4e 0%, #4a1a6e 50%, #1a0a2e 100%);
  }
  #ui {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    text-shadow: 2px 2px 0 #000;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }
  #overlay h1 { font-size: 42px; color: #ff006e; margin-bottom: 20px; }
  #overlay p { font-size: 18px; margin: 8px 0; }
  button {
    margin-top: 20px;
    padding: 12px 30px;
    font-size: 20px;
    background: #ff006e;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #ff3388; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas" width="600" height="700"></canvas>
  <div id="ui">
    <span>🍺 Счёт: <b id="score">0</b></span>
    <span>❤️ Жизни: <b id="lives">3</b></span>
    <span>🌻 Семки: <b id="seeds">0</b></span>
  </div>
  <div id="overlay">
    <h1>🥃 ЧУШПАН В БАРЕ ЛОЛ 🥃</h1>
    <p>← → двигайся</p>
    <p>Лови 🍺 пиво, избегай 🔪 ножи и 💺 стулья</p>
    <p>Собирай 🌻 семки — это валюта чушпана</p>
    <p style="color:#ffcc00; margin-top:15px;">Бригада чушпанов одобряет</p>
    <button onclick="startGame()">ПОГНАЛИ</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let player, items, score, lives, seeds, gameOver, spawnTimer, difficulty;

function init() {
  player = { x: W/2, y: H-80, w: 50, h: 60, dx: 0, emoji: '🧔' };
  items = [];
  score = 0; lives = 3; seeds = 0;
  gameOver = false; spawnTimer = 0; difficulty = 1;
}

const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

function startGame() {
  init();
  document.getElementById('overlay').classList.add('hidden');
  loop();
}

function spawnItem() {
  const types = [
    { emoji: '🍺', good: true, points: 10 },
    { emoji: '🔪', good: false, dmg: 1 },
    { emoji: '💺', good: false, dmg: 1 },
    { emoji: '🌻', good: true, points: 25, seed: true },
    { emoji: '🍺', good: true, points: 10 },
    { emoji: '🍸', good: true, points: 15 },
    { emoji: '🧨', good: false, dmg: 2 }
  ];
  const t = types[Math.floor(Math.random() * types.length)];
  items.push({
    x: 30 + Math.random() * (W-60),
    y: -40,
    r: 22,
    dy: 2 + Math.random() * (1 + difficulty*0.3),
    ...t
  });
}

function drawChushman() {
  ctx.font = '50px serif';
  ctx.textAlign = 'center';
  ctx.fillText(player.emoji, player.x, player.y);
  // шляпа чушпана
  ctx.fillText('🎩', player.x, player.y - 35);
}

function loop() {
  if (gameOver) return;
  
  // input
  if (keys['ArrowLeft'] || keys['a']) player.x -= 6;
  if (keys['ArrowRight'] || keys['d']) player.x += 6;
  player.x = Math.max(25, Math.min(W-25, player.x));
  
  // spawn
  spawnTimer++;
  if (spawnTimer > Math.max(15, 40 - difficulty*2)) {
    spawnItem();
    spawnTimer = 0;
  }
  if (score > 0 && score % 100 === 0) difficulty = score/100 + 1;
  
  // draw
  ctx.clearRect(0, 0, W, H);
  // пол бара
  ctx.fillStyle = '#3d1a5e';
  ctx.fillRect(0, H-40, W, 40);
  // стойка
  ctx.fillStyle = '#5e2a7e';
  ctx.fillRect(0, H-40, W, 5);
  
  drawChushman();
  
  // items
  for (let i = items.length-1; i >= 0; i--) {
    const it = items[i];
    it.y += it.dy;
    ctx.font = '36px serif';
    ctx.textAlign = 'center';
    ctx.fillText(it.emoji, it.x, it.y);
    
    // collision
    if (Math.abs(it.x - player.x) < 35 && Math.abs(it.y - player.y) < 40) {
      if (it.good) {
        score += it.points;
        if (it.seed) seeds++;
        flashColor = '#00ff88';
      } else {
        lives -= it.dmg;
        flashColor = '#ff0000';
      }
      items.splice(i, 1);
      continue;
    }
    
    if (it.y > H + 20) {
      if (it.good && !it.seed) score += 2; // упустил пиво = штраф моральный
      items.splice(i, 1);
    }
  }
  
  if (lives <= 0) endGame();
  
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
  document.getElementById('seeds').textContent = seeds;
  
  requestAnimationFrame(loop);
}

function endGame() {
  gameOver = true;
  const o = document.getElementById('overlay');
  o.classList.remove('hidden');
  o.innerHTML = `
    <h1>💀 ТЫ ОТКИС 💀</h1>
    <p>Очки: <b style="color:#ffcc00">${score}</b></p>
    <p>Семки: <b style="color:#ffcc00">${seeds}</b></p>
    <p style="margin-top:15px;">${score < 50 ? 'Егор бы справился лучше' : 'Чушпан уровень: БОГ'}</p>
    <button onclick="startGame()">ЕЩЁ РАЗ</button>
  `;
}
</script>
</body>
</html>
